<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags (Static fallbacks for crawlers) -->
    <title>Prabas Travel & Tours | Leading Travel Agency in Nepal</title>
    <meta name="title" content="Prabas Travel & Tours | Leading Travel Agency in Nepal" />
    <meta name="description" content="Prabas Travel & Tours is one of Nepal's leading travel agencies, offering domestic & international flight booking, holiday packages, visa assistance, and travel services since 2014. Contact us today!" />
    <meta name="keywords" content="Prabas Travel, travel agency Nepal, flight booking Nepal, holiday packages Nepal, FlightsNepal, Prabas Holidays, visa assistance Nepal, international flights Nepal, domestic flights Nepal, travel tours Kathmandu" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Prabas Travel & Tours" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/prabas-upload/prabaslogo.png" />
    <link rel="apple-touch-icon" href="/prabas-upload/prabaslogo.png" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://www.prabastravel.com/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.prabastravel.com/" />
    <meta property="og:title" content="Prabas Travel & Tours | Leading Travel Agency in Nepal" />
    <meta property="og:description" content="Nepal's trusted travel partner since 2014. Book flights, holiday packages, and get expert visa assistance. Domestic & international travel services." />
    <meta property="og:image" content="https://www.prabastravel.com/prabas-upload/prabaslogo.png" />
    <meta property="og:site_name" content="Prabas Travel & Tours" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://www.prabastravel.com/" />
    <meta name="twitter:title" content="Prabas Travel & Tours | Leading Travel Agency in Nepal" />
    <meta name="twitter:description" content="Nepal's trusted travel partner since 2014. Book flights, holiday packages, and get expert visa assistance." />
    <meta name="twitter:image" content="https://www.prabastravel.com/prabas-upload/prabaslogo.png" />

    <!-- Structured Data - Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "TravelAgency",
      "name": "Prabas Travel & Tours",
      "url": "https://www.prabastravel.com",
      "logo": "https://www.prabastravel.com/prabas-upload/prabaslogo.png",
      "description": "Prabas Travel & Tours is one of Nepal's leading travel agencies, offering domestic & international flight booking, holiday packages, visa assistance, and comprehensive travel services since 2014.",
      "foundingDate": "2014",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Kathmandu",
        "addressCountry": "NP"
      },
      "sameAs": [],
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer service",
        "availableLanguage": ["English", "Nepali"]
      }
    }
    </script>

    <!-- Structured Data - WebSite (enables sitelinks search box) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Prabas Travel & Tours",
      "url": "https://www.prabastravel.com",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://www.prabastravel.com/?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
